<ion-header>
  <ion-toolbar>
    <ion-title>Citas</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/configuracion">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- *ngIf: si hay cita se muestra; si no, un mensaje -->
  <app-cita-item
    *ngIf="cita; else sinCitas"
    [cita]="cita"
    [mostrarBorrar]="puedeBorrar"
    (borrar)="eliminar($event)">
  </app-cita-item>

  <ng-template #sinCitas>
    <p class="ion-text-center">No hay citas. Agrega una con el botón +</p>
  </ng-template>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/citas">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
