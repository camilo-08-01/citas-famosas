<ion-item lines="full">
  <ion-label class="ion-text-wrap">
    <h2>{{ cita.frase }}</h2>
    <p class="autor">{{ cita.autor }}</p>
  </ion-label>

  <ion-button *ngIf="mostrarBorrar" fill="clear" color="danger" slot="end" (click)="onBorrar()">
    <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
  </ion-button>
</ion-item>
